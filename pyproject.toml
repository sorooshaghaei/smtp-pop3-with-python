[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smtp-pop3-email-client"
version = "0.2.0"
description = "A Tkinter SMTP/POP3 email client with reusable mail protocol helpers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Soroosh AGHAEI" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
smtp-pop3-email = "email_app.cli:main"

[tool.setuptools.packages.find]
include = ["email_app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
